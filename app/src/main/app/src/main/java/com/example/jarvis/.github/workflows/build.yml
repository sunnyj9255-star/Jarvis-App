name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Download Hindi model
        run: |
          curl -L -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q m.zip
          mkdir -p app/src/main/assets/model
          cp -r vosk-model-small-hi-0.22/* app/src/main/assets/model/
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: JarvisApp-apk, path: app/build/outputs/apk/debug/app-debug.apk }
